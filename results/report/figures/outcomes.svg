  <g id="text_30">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="11.232" y="19.578047" transform="rotate(-0 11.232 19.578047)">What happens after each fault: baseline vs protected firmware</text>
  </g>
  <g id="text_31">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(11.232 41.453437)">Left: the unprotected firmware after the fault. Right: the protected firmware (detection + recovery) for the same fault. Marker colour: red = crash or hang,</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(11.232 53.153437)">yellow = wrong behaviour, green = normal operation restored.</text>
